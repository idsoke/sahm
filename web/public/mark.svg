<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Sahm mark">
  <title>Sahm</title>
  <!-- سهم (sahm) is Arabic for both "share" and "arrow": a white arrow rising to the right on an emerald rounded square, over a short ground line. -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="#0f6b4f"/>
  <path d="M36 92L86 42" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <path d="M56 40H88V72" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 104H94" fill="none" stroke="#9fe3c4" stroke-width="6" stroke-linecap="round"/>
</svg>
