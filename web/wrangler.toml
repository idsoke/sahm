# Sahm: saham syariah Indonesia, built on idx (github.com/fzn0x/idx, MIT).
name = "sahm"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# account_id: wrangler asks for it on the first deploy (or set
# CLOUDFLARE_ACCOUNT_ID); it is the deployer's own Cloudflare account.

# Served on sahm.<subdomain>.workers.dev until a custom domain is attached.
# PUBLIC_HOST below must be that host name: the Worker answers 404 on any
# other (see src/worker.js). Move every file to the real host with
#   node web/scripts/set-host.mjs sahm.<subdomain>.workers.dev
# For a custom domain later: workers_dev = false, a routes entry with
# custom_domain = true, and set-host.mjs again.
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "404-page"
# The docs (/docs, /llms*.txt) pass through the Worker for the charset and
# CORS of the Markdown files; every other asset gets its headers from
# public/_headers.
run_worker_first = ["/api/*", "/healthz", "/docs", "/docs/*", "/llms.txt", "/llms-full.txt"]

# The docs pages, llms.txt and llms-full.txt are generated from README.md and
# docs/*.md into public/ (gitignored) before every `wrangler dev` and
# `wrangler deploy`.
[build]
command = "node scripts/docs.mjs"
watch_dir = ["scripts", "../docs"]

[vars]
PUBLIC_HOST = "sahm.sahm-web.workers.dev"
# KSEI register mirror published by .github/workflows/ownership.yml.
OWN_MIRROR_URL = "https://github.com/fzn0x/idx/releases/download/ownership-data"
OWN_KEEP_RELEASES = "6"
# D1 free tier: 100k rows written per UTC day; the register takes ~22k per month
# loaded, and ~43k to replace a month D1 already holds (the delete counts too).
OWN_DAILY_WRITE_BUDGET = "60000"

# Create it once with `npx wrangler d1 create sahm`, paste the id it prints
# here, then `npx wrangler d1 migrations apply sahm --remote`.
[[d1_databases]]
binding = "DB"
database_name = "sahm"
database_id = "a49e3536-5efe-4898-bdb7-49d77c593c82"
migrations_dir = "migrations"

# Snapshot refresh. The handler itself decides how much to do: every minute
# during IDX trading hours (WIB), every 15 minutes otherwise.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
