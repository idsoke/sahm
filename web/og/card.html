<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sahm social card</title>
<!-- Source of public/og.png (1200x630). Not served; render with scripts/og.mjs.
     Halaman Bursa, light: the newsprint ground, the navy masthead with the
     mark, the headline in Libre Franklin 800 and everything else in Atkinson
     Hyperlegible Next, three plain lines on a white sheet, and the address over
     a 4px ink rule, as the site's footer signs off. No figures: the card never
     prints an IHSG value or a price. Web fonts, so the render does not depend
     on installed fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=block">
<style>
  :root {
    --paper: #f3fbf7; --sheet: #ffffff; --rule: #cde9db; --ink: #0f1f1a; --ink-2: #3d5249;
    --navy: #047857; --on-navy: #ffffff; --on-navy-2: #d1fae5;
    --text: "Atkinson Hyperlegible Next", sans-serif; --head: "Plus Jakarta Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-image: radial-gradient(40rem 20rem at 8% 30%, rgb(16 185 129 / 0.18), transparent 62%), radial-gradient(36rem 18rem at 95% 40%, rgb(14 165 233 / 0.16), transparent 62%), radial-gradient(30rem 16rem at 60% 85%, rgb(245 158 11 / 0.14), transparent 62%);
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font-family: var(--text); font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .mast { flex: none; height: 108px; display: flex; align-items: center; gap: 20px; padding: 0 64px; background: linear-gradient(120deg, #064e3b 0%, #047857 48%, #0f766e 100%); color: var(--on-navy); border-bottom: 6px solid #f59e0b; }
  .mast img { display: block; width: 64px; height: 64px; }
  .mast .name { display: grid; line-height: 1.05; }
  .mast b { font-family: var(--head); font-size: 46px; font-weight: 800; letter-spacing: -0.02em; }
  .mast small { margin-top: 3px; font-size: 21px; font-weight: 700; color: var(--on-navy-2); }

  .lead { flex: none; padding: 44px 64px 0; }
  h1 { background: linear-gradient(90deg, #065f46, #0f766e 45%, #0369a1); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; font-family: var(--head); font-size: 84px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
  .en { margin-top: 16px; font-size: 32px; color: var(--ink-2); }

  .lines {
    flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 34px 64px 0; background: var(--sheet); border: 2px solid var(--rule); border-radius: 18px; box-shadow: 0 18px 40px -18px rgb(6 78 59 / 0.35); overflow: hidden;
  }
  .lines p { padding: 20px 24px 22px; font-size: 24px; line-height: 1.3; color: var(--ink-2); }
  .lines p + p { border-left: 2px solid var(--rule); }
  .lines p b { color: var(--ink); }

  .sign { margin: auto 64px 0; padding: 16px 0 28px; border-top: 4px solid; border-image: linear-gradient(90deg, #10b981, #f59e0b 50%, #0ea5e9) 1; color: #065f46; font-size: 30px; font-weight: 800; letter-spacing: -0.005em; }
</style>
</head>
<body>
  <header class="mast">
    <img src="../public/mark.svg" alt="">
    <span class="name"><b>Sahm</b><small>saham syariah Indonesia</small></span>
  </header>
  <section class="lead">
    <h1>Saham syariah hari ini</h1>
    <p class="en" lang="en">Indonesian sharia stocks today</p>
  </section>
  <div class="lines">
    <p><span><b>Daftar Efek Syariah</b> OJK untuk setiap saham</span></p>
    <p><span><b>Penyaring</b> saham syariah dengan rasio keuangan</span></p>
    <p><span><b>Gratis</b>, tanpa akun, data publik tertunda</span></p>
  </div>
  <footer class="sign">sahm.sahm-web.workers.dev</footer>
</body>
</html>
